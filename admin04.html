<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>真珠預點後台</title>

    <link rel="shortcut icon" href="https://www.jinzhu.com.tw/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --pine: #004d40;
            --pine-dark: #002e27;
            --pine-light: #00695c;
            --gold: #b89150;
            --gold-light: #d4a85a;
            --cream: #f7f3ec;
            --paper: #f8fafc;
            --ink: #1e293b;
            --stone: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--paper); color: var(--ink); }
        .font-serif { font-family: 'Noto Serif TC', serif; }

        /* ── TOAST SYSTEM ── */
        #toast-container {
            position: fixed; bottom: 24px; right: 24px;
            z-index: 99999; display: flex; flex-direction: column; gap: 10px;
            pointer-events: none;
        }
        .toast-item {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 13px; font-weight: 700;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            animation: toastIn 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
            pointer-events: all; min-width: 220px; max-width: 360px;
        }
        .toast-item.success { background: #004d40; color: white; }
        .toast-item.error   { background: #dc2626; color: white; }
        .toast-item.warn    { background: #d97706; color: white; }
        .toast-item.info    { background: #1e40af; color: white; }
        .toast-item.out     { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn  { from { opacity:0; transform: translateX(30px); } to { opacity:1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity:1; transform: translateX(0); }    to { opacity:0; transform: translateX(30px); } }

        /* ── CONFIRM DIALOG ── */
        #confirm-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 99998; display: none;
            align-items: center; justify-content: center; padding: 16px;
            backdrop-filter: blur(4px);
        }
        #confirm-overlay.visible { display: flex; }
        #confirm-box {
            background: white; border-radius: 20px; padding: 32px 28px;
            width: 100%; max-width: 380px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
            animation: scaleIn 0.25s ease both;
        }
        @keyframes scaleIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #confirm-icon   { font-size: 2rem; margin-bottom: 12px; }
        #confirm-title  { font-size: 1rem; font-weight: 900; color: var(--ink); margin-bottom: 8px; }
        #confirm-msg    { font-size: 13px; color: var(--stone); line-height: 1.7; margin-bottom: 24px; }
        .confirm-actions { display: flex; gap: 10px; }
        .confirm-cancel {
            flex: 1; padding: 12px; border-radius: 12px;
            border: 1.5px solid var(--border); background: white;
            color: var(--stone); font-weight: 700; font-size: 13px;
            cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
        }
        .confirm-ok {
            flex: 1.5; padding: 12px; border-radius: 12px; border: none;
            font-weight: 700; font-size: 13px;
            cursor: pointer; transition: opacity 0.2s;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .confirm-ok:active { opacity: 0.85; }
        .confirm-ok.danger { background: #dc2626; color: white; }
        .confirm-ok.primary { background: var(--pine); color: white; }

        /* ── LOGIN ── */
        #login-screen {
            position: fixed; inset: 0; z-index: 9999;
            background:
                linear-gradient(115deg, #002e27 0%, #004d40 42%, #fbfaf6 42.1%, #fbfaf6 100%);
            display: flex; align-items: stretch; justify-content: center;
            padding: 38px;
            overflow: hidden;
            isolation: isolate;
        }

            content: 'JIN-ZHU';
