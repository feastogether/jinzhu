<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>真珠管理後台</title>
<link rel="icon" type="image/x-icon" href="https://www.jinzhu.com.tw/favicon.ico">
<link rel="shortcut icon" href="https://www.jinzhu.com.tw/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pine:#004d40;--pine2:#00695c;--gold:#b89150;--ink:#1a1a2e;--stone:#64748b;--border:#e2e8f0;--paper:#f0f4f8;--red:#dc2626;--blue:#2563eb;--green:#16a34a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:#0c1a12;color:var(--ink);min-height:100vh;}
#login-screen{position:fixed;inset:0;background:linear-gradient(115deg,#002e27 0%,#004d40 42%,#fbfaf6 42.1%,#fbfaf6 100%);display:flex;align-items:stretch;justify-content:center;z-index:999;padding:38px;overflow:hidden;isolation:isolate;}
#login-screen::before{content:'JIN-ZHU';position:absolute;left:5vw;bottom:-4.2rem;font-family:'Noto Serif TC',serif;font-size:clamp(4rem,12vw,10rem);font-weight:900;letter-spacing:.08em;color:rgba(255,255,255,.045);pointer-events:none;}
#login-screen::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 16% 22%,rgba(184,145,80,.22),transparent 27%),linear-gradient(90deg,transparent 0 54%,rgba(184,145,80,.08) 54% 54.4%,transparent 54.4%);pointer-events:none;}
.login-shell{position:relative;z-index:1;width:min(1060px,100%);min-height:min(680px,calc(100vh - 76px));display:grid;grid-template-columns:minmax(0,1.1fr) 420px;align-items:stretch;}
.login-story{color:white;padding:clamp(38px,6vw,76px) clamp(30px,5vw,64px);display:flex;flex-direction:column;justify-content:center;min-height:560px;}
.login-story-logo{width:160px;filter:brightness(0) invert(1);display:block;margin-bottom:54px;}
.login-kicker{font-size:11px;font-weight:900;letter-spacing:.42em;color:rgba(212,168,90,.95);text-transform:uppercase;margin-bottom:18px;}
.login-headline{font-family:'Noto Serif TC',serif;font-size:clamp(2rem,4vw,3.7rem);line-height:1.22;font-weight:900;letter-spacing:.02em;max-width:560px;}
.lc{align-self:center;background:#fbfaf6;border:1px solid rgba(184,145,80,.24);border-radius:6px;padding:44px 42px;width:100%;box-shadow:0 28px 70px rgba(0,46,39,.18);text-align:left;color:var(--ink);}
.lc-logo{width:126px;display:block;margin:0 auto 22px;}
.lc-sub{font-size:12px;color:var(--stone);line-height:1.8;margin-bottom:30px;text-align:center;letter-spacing:0;margin-top:0;}
.login-field-label{display:block;font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.li{width:100%;padding:14px 15px;background:#fffaf1;border:1.5px solid rgba(184,145,80,.24);border-radius:4px;color:var(--ink);font-size:14px;font-family:'Noto Sans TC',sans-serif;margin-bottom:16px;outline:none;transition:.2s;}
.li::placeholder{color:#a8a29e;}.li:focus{border-color:var(--pine);background:white;box-shadow:0 0 0 4px rgba(0,77,64,.08);}
.lb{width:100%;padding:15px;background:var(--pine);color:white;border:none;border-radius:4px;font-size:14px;font-weight:800;letter-spacing:.14em;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:.2s;margin-top:6px;}
.lb:hover{background:var(--pine2);transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,77,64,.18);}#login-err{color:#b91c1c;background:#fef2f2;border-radius:4px;padding:8px 10px;font-size:12px;font-weight:700;text-align:center;margin-top:12px;display:none;}
@media (max-width:840px){#login-screen{padding:22px;background:linear-gradient(180deg,var(--pine) 0%,var(--pine) 42%,#fbfaf6 42.1%,#fbfaf6 100%);overflow-y:auto}.login-shell{display:block;min-height:0}.login-story{min-height:auto;padding:26px 6px 34px}.login-story-logo{width:120px;margin-bottom:28px}.lc{padding:34px 24px}}
#app{display:flex;height:100vh;overflow:hidden;}
.sb{width:230px;flex-shrink:0;background:#0f1f14;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.05);transition:width .25s ease;overflow:hidden;}
.sb.collapsed{width:68px;}
.sb-logo{padding:20px 14px 18px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:10px;}
.sb-brand{flex:1;min-width:0;}
.sb-logo-img{height:30px;max-width:110px;object-fit:contain;filter:brightness(0) invert(1);}
.sb-logo-name{font-family:'Noto Serif TC',serif;color:var(--gold);font-size:1.15rem;font-weight:900;}
.sb-badge{display:inline-block;background:rgba(184,145,80,0.15);color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.15em;padding:2px 8px;border-radius:999px;margin-top:6px;}
.sb-toggle{width:28px;height:28px;border-radius:9px;border:none;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.45);cursor:pointer;font-size:15px;transition:.15s;flex-shrink:0;}
.sb-toggle:hover{background:rgba(255,255,255,0.1);color:white;}
.sb.collapsed .sb-brand,.sb.collapsed .sb-badge,.sb.collapsed .user-lbl{display:none;}
.sb.collapsed .sb-logo{justify-content:center;padding-left:0;padding-right:0;flex-direction:column;}
.sb.collapsed .sb-toggle{transform:rotate(180deg);}
nav{flex:1;padding:10px 0;overflow-y:auto;}
.ni{display:flex;align-items:center;gap:10px;padding:11px 22px;color:rgba(255,255,255,0.4);font-size:13px;cursor:pointer;transition:.15s;border-left:3px solid transparent;}
.ni:hover{color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.03);}
.ni.on{color:var(--gold);border-left-color:var(--gold);background:rgba(184,145,80,0.07);}
.ni-icon{font-size:15px;width:18px;text-align:center;}
.sb.collapsed .ni{justify-content:center;padding:12px 0;font-size:0;gap:0;border-left:none;}
.sb.collapsed .ni-icon{font-size:17px;width:auto;}
.sb.collapsed .lo-btn{font-size:0;padding:10px 0;}
.sb.collapsed .lo-btn::before{content:'↪';font-size:15px;}
.sb-foot{padding:14px 22px;border-top:1px solid rgba(255,255,255,0.05);}
.user-lbl{font-size:11px;color:rgba(255,255,255,0.2);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lo-btn{width:100%;padding:8px;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.35);border:none;border-radius:10px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:.15s;}
.lo-btn:hover{background:rgba(255,255,255,0.09);color:white;}
.main{flex:1;overflow-y:auto;background:var(--paper);}
.page{display:none;padding:32px;max-width:1300px;}
.page.on{display:block;}
.ph{margin-bottom:28px;}.pt{font-family:'Noto Serif TC',serif;font-size:1.5rem;font-weight:900;color:var(--pine);}
.ps{font-size:12px;color:var(--stone);margin-top:4px;}
.card{background:white;border-radius:20px;border:1px solid var(--border);box-shadow:0 2px 16px rgba(0,0,0,0.04);padding:24px;margin-bottom:16px;}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.ct{font-weight:900;font-size:14px;color:var(--pine);}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.sc{background:white;border-radius:16px;border:1px solid var(--border);padding:20px;}
.sv{font-size:2rem;font-weight:900;font-family:'Noto Serif TC',serif;color:var(--pine);}
.sl{font-size:11px;color:var(--stone);font-weight:600;margin-top:4px;}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.store-card{background:white;border-radius:20px;border:1px solid var(--border);padding:22px;position:relative;overflow:hidden;transition:box-shadow .2s;}
.store-card:hover{box-shadow:0 8px 28px rgba(0,77,64,0.12);}
.store-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--pine),var(--pine2));}
.sid-badge{position:absolute;top:14px;right:16px;background:#f0fdf4;color:var(--pine);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;}
.sn{font-weight:900;font-size:16px;color:var(--pine);margin-bottom:6px;}
.sm{font-size:12px;color:var(--stone);line-height:1.7;}
.s-badge{display:inline-flex;gap:4px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;margin-top:12px;}
.ba{background:#dcfce7;color:#16a34a;}.bi{background:#f1f5f9;color:#64748b;}
.sa{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;border:none;transition:.15s;}
.btn-p{background:var(--pine);color:white;}.btn-p:hover{background:var(--pine2);}
.btn-g{background:#f1f5f9;color:var(--stone);}.btn-g:hover{background:#e2e8f0;}
.btn-d{background:#fef2f2;color:var(--red);}.btn-d:hover{background:#fee2e2;}
.btn-gold{background:rgba(184,145,80,0.1);color:var(--gold);}.btn-gold:hover{background:rgba(184,145,80,0.2);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:8px;}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:10px 14px;font-size:10px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.1em;border-bottom:2px solid var(--border);white-space:nowrap;}
tbody td{padding:13px 14px;border-bottom:1px solid #f8fafc;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafcff;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.mo.open{display:flex;}
.mb{background:white;border-radius:26px;padding:34px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 28px 64px rgba(0,0,0,0.2);}
.mt{font-family:'Noto Serif TC',serif;font-size:1.2rem;font-weight:900;color:var(--pine);margin-bottom:22px;}
.fg{margin-bottom:14px;}
.fl{display:block;font-size:10px;font-weight:700;color:var(--stone);margin-bottom:5px;text-transform:uppercase;letter-spacing:.1em;}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'Noto Sans TC',sans-serif;outline:none;transition:.2s;}
.fi:focus{border-color:var(--pine);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
