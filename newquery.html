<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>真珠 · 訂單查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pine:#004d40;--gold:#b89150;--cream:#f7f3ec;--paper:#faf8f4;--ink:#1a2820;--stone:#7c7468;--border:rgba(184,145,80,.22)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.hero{min-height:34vh;background:linear-gradient(rgba(8,20,15,.62),rgba(8,20,15,.74)),url('https://www.jinzhu.com.tw/storage/website/kv/jinzhu20230904143032_PC-KV.jpeg') center/cover;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:48px 22px}
.logo{height:44px;filter:brightness(0) invert(1);margin-bottom:18px}
.tag{font-size:10px;letter-spacing:.38em;color:#e8d5a0;font-weight:900;text-transform:uppercase}
h1{font-family:'Noto Serif TC',serif;font-size:2rem;letter-spacing:.18em;margin-top:10px}
.wrap{max-width:760px;margin:-42px auto 60px;padding:0 18px;position:relative}
.panel{background:white;border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:0 22px 60px rgba(0,77,64,.12)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px}
label{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:900;margin-bottom:8px}
input{width:100%;border:1.5px solid rgba(0,0,0,.08);border-radius:14px;padding:14px 16px;font-size:15px;outline:none;font-family:'Noto Sans TC',sans-serif;background:#fffdf8}
input:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(0,77,64,.08)}
button{border:none;border-radius:14px;background:var(--pine);color:white;font-weight:900;padding:0 22px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;letter-spacing:.08em}
.hint{font-size:12px;color:var(--stone);line-height:1.8;margin-top:12px}
.result{margin-top:18px;display:grid;gap:12px}
.card{border:1px solid var(--border);border-radius:18px;padding:18px;background:#fffdf8}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.name{font-weight:900;color:var(--pine);font-size:1rem}
.store{font-size:11px;color:var(--gold);font-weight:900;margin-top:3px}
.status{font-size:11px;font-weight:900;border-radius:999px;padding:4px 10px;background:#fef3c7;color:#92400e;white-space:nowrap}
.status.ok{background:#dcfce7;color:#15803d}.status.end{background:#f1f5f9;color:#64748b}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.meta div{background:white;border-radius:12px;padding:10px 12px;font-size:12px;color:var(--stone)}
.meta b{display:block;color:var(--pine);font-size:13px;margin-top:3px}
.items{font-size:12px;color:var(--ink);line-height:1.8;border-top:1px solid var(--border);padding-top:12px}
.empty{text-align:center;color:var(--stone);font-size:13px;padding:28px 8px;line-height:1.8}
.back{display:block;text-align:center;color:var(--pine);font-weight:900;text-decoration:none;margin-top:18px;font-size:13px}
@media(max-width:560px){.row{grid-template-columns:1fr}button{padding:14px}.hero{min-height:30vh}h1{font-size:1.65rem}}
</style>
</head>
<body>
<section class="hero">
  <div>
    <img class="logo" src="https://www.jinzhu.com.tw/images/Jinzhu_logo.svg" alt="真珠">
    <div class="tag">Order Tracking</div>
    <h1>訂單查詢</h1>
  </div>
</section>
<main class="wrap">
  <div class="panel">
    <label for="keyword">輸入電話或姓名</label>
    <div class="row">
      <input id="keyword" placeholder="例如：0912 或 王小明" autocomplete="tel" onkeydown="if(event.key==='Enter')searchOrders()">
      <button onclick="searchOrders()">查詢</button>
    </div>
    <p class="hint">請輸入訂單留下的電話或姓名，系統會顯示最近符合的預點餐紀錄。</p>
    <div id="result" class="result"></div>
    <a class="back" href="order.html">返回預點餐</a>
  </div>
</main>
<script>
const SUPABASE_URL='https://pydlnqriztpzgxbjuohm.supabase.co';
const SUPABASE_KEY='sb_publishable_ISKUWOXUR9A-1y81xCOUXg_8-zNle3v';
const _s=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let stores=[];

function fmtDate(v){
  if(!v)return '未指定';
  const tw=new Date(new Date(v).getTime()+8*3600000);
  const hh=String(tw.getUTCHours()).padStart(2,'0'),mm=String(tw.getUTCMinutes()).padStart(2,'0');
  const time=(hh==='00'&&mm==='00')?'':` ${hh}:${mm}`;
  return `${tw.getUTCFullYear()}/${String(tw.getUTCMonth()+1).padStart(2,'0')}/${String(tw.getUTCDate()).padStart(2,'0')}${time}`;
}
function statusLabel(s){
  if(s==='confirmed'||s==='synced')return ['確認完成','ok'];
  if(s==='ended')return ['已結束','end'];
  return ['確認中',''];
}
function itemText(items){
  return (items||[]).map(i=>`${i.name||'餐點'}　$${i.price||0}`).join('<br>')||'無餐點明細';
}
function storeName(id){
  return stores.find(s=>String(s.id)===String(id||1))?.name||'真珠';
}
async function loadStores(){
  const{data}=await _s.from('stores').select('id,name').eq('is_active',true);
  stores=data||[];
}
async function searchOrders(){
  const kw=document.getElementById('keyword').value.trim();
  const box=document.getElementById('result');
  if(!kw){box.innerHTML='<div class="empty">請先輸入電話或姓名。</div>';return;}
  box.innerHTML='<div class="empty">查詢中...</div>';
  const safe=kw.replace(/[,%]/g,'');
  const{data,error}=await _s.from('orders')
    .select('id,customer_name,phone,store_id,order_content,total_price,status,booking_date,created_at,is_takeout,note')
    .or(`phone.ilike.%${safe}%,customer_name.ilike.%${safe}%`)
    .order('created_at',{ascending:false})
    .limit(10);
  if(error){box.innerHTML='<div class="empty">查詢失敗，請稍後再試。</div>';return;}
  if(!data?.length){box.innerHTML='<div class="empty">找不到符合的訂單，請確認電話或姓名是否與下單時一致。</div>';return;}
  box.innerHTML=data.map(o=>{
    const [sl,cls]=statusLabel(o.status);
    return `<article class="card">
      <div class="card-head">
        <div><div class="name">${o.customer_name||'未命名'}${o.is_takeout?'（外帶）':''}</div><div class="store">${storeName(o.store_id)}</div></div>
        <span class="status ${cls}">${sl}</span>
      </div>
      <div class="meta">
        <div>預約 / 取餐時間<b>${fmtDate(o.booking_date)}</b></div>
        <div>電話<b>${o.phone||'未填寫'}</b></div>
        <div>總金額<b>$${o.total_price||0}</b></div>
      </div>
      <div class="items">${itemText(o.order_content)}</div>
      ${o.note?`<div class="items">備註：${o.note}</div>`:''}
    </article>`;
  }).join('');
}
(async()=>{
  await loadStores();
  const p=new URLSearchParams(location.search);
  const q=p.get('phone')||p.get('q')||'';
  if(q){document.getElementById('keyword').value=q;searchOrders();}
})();
</script>
</body>
</html>
